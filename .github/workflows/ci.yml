name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app & docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v7
        with:
          name: webui-dist
          path: server/internal/webui/dist
          include-hidden-files: true

  server:
    name: Server
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/download-artifact@v8
        with:
          name: webui-dist
          path: server/internal/webui/dist
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
        working-directory: server
      - name: Vet
        run: go vet ./...
        working-directory: server
      - name: Test
        run: go test -race ./...
        working-directory: server
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o ../bin/bombaychitra ./cmd/bombaychitra
        working-directory: server

  pipeline:
    name: Data pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/cache@v6
        with:
          path: data/tools/*.jar
          key: pipeline-tools-${{ hashFiles('scripts/test-pipeline.sh') }}
      - name: Unit tests
        # Downloads Planetiler and the JUnit console launcher (checksums verified) on a cache miss.
        run: scripts/test-pipeline.sh --disable-ansi-colors
      - name: Compile with warnings as errors
        run: |
          mkdir -p pipeline/build/strict
          javac -Werror -Xlint:all,-serial,-processing,-this-escape -encoding UTF-8 -implicit:none \
            -sourcepath pipeline/src -cp data/tools/planetiler-0.10.2.jar -d pipeline/build/strict $(find pipeline/src -name '*.java')
