name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build web app
        run: npm ci && npm run build
        working-directory: web
      - name: Cross-compile
        working-directory: server
        run: |
          mkdir -p ../dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""; [ "$os" = windows ] && ext=".exe"
            name="bombaychitra_${GITHUB_REF_NAME}_${os}_${arch}"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/AmmaarBakshi/BombayChitra/server/internal/httpapi.Version=${GITHUB_REF_NAME}" \
              -o "../dist/${name}/bombaychitra${ext}" ./cmd/bombaychitra
            cp ../LICENSE ../README.md "../dist/${name}/"
            (cd ../dist && if [ "$os" = windows ]; then zip -qr "${name}.zip" "$name"; else tar czf "${name}.tar.gz" "$name"; fi)
          done
      - name: Attach the dataset
        # The tagged release carries the data it was tested with, so `bombaychitra download --release <tag>` and
        # the binaries stay a matching pair even after data-latest moves on.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download data-latest --dir dist --pattern 'bombaychitra.*' --pattern SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS && rm SHA256SUMS)
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz *.zip bombaychitra.pmtiles bombaychitra.db > checksums.txt && cp checksums.txt SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/bombaychitra.pmtiles dist/bombaychitra.db dist/checksums.txt dist/SHA256SUMS --generate-notes --verify-tag

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/bombaychitra
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
