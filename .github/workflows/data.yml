name: Data

# Rebuilds the dataset from the latest OpenStreetMap extract and publishes it as assets of the
# "data-latest" release, so anyone can run BombayChitra without building data themselves.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 1' # Mondays 02:30 UTC (08:00 IST)

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build tiles and database
        run: JAVA_OPTS=-Xmx6g ./scripts/build-data.sh
      - name: Verify the server against the new data
        run: go test ./...
        working-directory: server
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stamp=$(date -u +%Y-%m-%d)
          notes="OpenStreetMap data as of ${stamp}. Download both files into data/build/ and run \`bombaychitra serve\`. Data © OpenStreetMap contributors, ODbL."
          gh release view data-latest >/dev/null 2>&1 || gh release create data-latest --title "Data (latest)" --notes "$notes" --latest=false
          gh release edit data-latest --notes "$notes"
          gh release upload data-latest data/build/bombaychitra.pmtiles data/build/bombaychitra.db --clobber
