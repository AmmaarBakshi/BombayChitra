name: Data

# Rebuilds the dataset from the latest OpenStreetMap extract and publishes it as assets of the
# "data-latest" release, so anyone can run BombayChitra without building data themselves.
on:
  workflow_dispatch:
    inputs:
      allow_regressions:
        description: Publish even if the data regression check finds drops
        type: boolean
        default: false
  schedule:
    - cron: '30 2 * * 1' # Mondays 02:30 UTC (08:00 IST)

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build tiles and database
        # A failed Overture download fails the release rather than publishing a dataset without it.
        run: OVERTURE_REQUIRED=1 JAVA_OPTS=-Xmx6g ./scripts/build-data.sh
      - name: Verify the server against the new data
        run: go test ./...
        working-directory: server
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: API contract and end-to-end tests
        # Every documented example request must still answer as api/openapi.yaml says, and the map must load,
        # search and route, with the new data.
        run: |
          (cd web && npm ci && npm run build)
          (cd server && go build -o ../bin/bombaychitra ./cmd/bombaychitra)
          ./bin/bombaychitra serve --addr 127.0.0.1:8080 --log-level warn &
          for i in $(seq 30); do curl -sf http://127.0.0.1:8080/healthz > /dev/null && break; sleep 1; done
          cd web
          BC_API_URL=http://127.0.0.1:8080 npm run test:contract
          npx playwright install --with-deps chromium
          BC_E2E_URL=http://127.0.0.1:8080 npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report
          path: web/test-results
          if-no-files-found: ignore
      - name: Compare with the previous release
        # Fails the run (so nothing is published) when places, bridges, buildings, transit or the routing graph
        # shrink by more than 5 % — usually upstream vandalism or a broken download, not a real change. Re-run the
        # workflow with "allow_regressions" after checking a legitimate drop.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download data-latest --dir previous --pattern bombaychitra.db 2>/dev/null; then
            python3 scripts/check-data.py data/build/bombaychitra.db --baseline previous/bombaychitra.db \
              ${{ inputs.allow_regressions && '--warn-only' || '' }}
          else
            echo "No previous release to compare with"
          fi
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stamp=$(date -u +%Y-%m-%d)
          notes="OpenStreetMap data as of ${stamp}. Run \`bombaychitra download\` (or download both files into data/build/) and \`bombaychitra serve\`. Data © OpenStreetMap contributors, ODbL."
          gh release view data-latest >/dev/null 2>&1 || gh release create data-latest --title "Data (latest)" --notes "$notes" --latest=false
          gh release edit data-latest --notes "$notes"
          (cd data/build && sha256sum bombaychitra.pmtiles bombaychitra.db > SHA256SUMS)
          gh release upload data-latest data/build/bombaychitra.pmtiles data/build/bombaychitra.db data/build/SHA256SUMS --clobber
