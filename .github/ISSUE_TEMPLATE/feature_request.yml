name: Feature request
description: Suggest a new layer, category, area, API endpoint or app feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the use case, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: osm
    attributes:
      label: OpenStreetMap tags (for data features)
      description: Which OSM tags describe the features, e.g. `amenity=charging_station`.
